<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add-Student</title>
    <link rel="stylesheet" href="./style.css">
    <nav>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./addstudent.html">Add-Students</a>
    <a href="./viewstudent.html">View-Students</a>
    <a href="./logout.html">LogOut</a>
    </nav>
</head>
<body>
    
    <br>
    <b><h1>Add New Student</h1></b>
    <br><br>
    <form action="./viewstudent.html" method="get">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required> <br> <br>
        <label for="id">Id</label>
        <input type="number" name="id" id="id" required> <br> <br>
        <label for="branch">Branch</label> <br> <br>
        <select name="branch" id="branch">
            <option value="CS">CS</option>
            <option value="IT">IT</option>
            <option value="CSE">CSE</option>
            <option value="CSM">CSM</option>
        </select required> <br> <br>
        <button type="submit">Add</button>
    </form>
</body>
</html>
