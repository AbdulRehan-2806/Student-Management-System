<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
    <link rel="stylesheet" href="./style.css">
     <nav>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./addstudent.html">Add-Students</a>
    <a href="./viewstudent.html">View-Students</a>
    <a href="./logout.html">LogOut</a>
    </nav>
    <script>
        function deleteStudent() {
            event.preventDefault();
            const id = document.getElementById('id').value;
            var students = JSON.parse(localStorage.getItem("students")) || [];
            var studentIndex = students.findIndex(student => student.id === id);
            if (studentIndex !== -1) {
                students.splice(studentIndex, 1);
                localStorage.setItem("students", JSON.stringify(students));
                alert('Student deleted successfully!');
                window.location.href = "viewstudent.html";
            } else {
                alert('Student not found. Please try again.');
            }
        }
    </script>
</head>
