<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit</title>
    <link rel="stylesheet" href="./style.css">
    <nav>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./addstudent.html">Add-Students</a>
    <a href="./viewstudent.html">View-Students</a>
    <a href="./logout.html">LogOut</a>
    </nav>
    <script>
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function loadStudent() {
            const id = getQueryParam('id');
            if (!id) {
                alert('Student not found. Please try again.');
                window.location.href = 'viewstudent.html';
                return;
            }

            const students = JSON.parse(localStorage.getItem('students')) || [];
            const student = students.find(student => student.id === id);
            if (!student) {
                alert('Student not found. Please try again.');
                window.location.href = 'viewstudent.html';
                return;
            }

            document.getElementById('name').value = student.name;
            document.getElementById('id').value = student.id;
            document.getElementById('branch').value = student.branch;
        }

        function editStudent(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const id = document.getElementById('id').value;
            const branch = document.getElementById('branch').value;
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const studentIndex = students.findIndex(student => student.id === id);
            if (studentIndex !== -1) {
                students[studentIndex].name = name;
                students[studentIndex].branch = branch;
                localStorage.setItem('students', JSON.stringify(students));
                window.location.href = 'viewstudent.html';
            } else {
                alert('Student not found. Please try again.');
            }
        }

        window.onload = loadStudent;
    </script>
</head>
<body>
    <br>
    <b><h1>Edit Student Details</h1></b>
    <br><br>
    <form onsubmit="return editStudent(event)">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required> <br> <br>
        <label for="id">Id</label>
        <input type="text" name="id" id="id" disabled> <br> <br>
        <label for="branch">Branch</label> <br> <br>
        <select name="branch" id="branch" required>
            <option value="CS">CS</option>
            <option value="IT">IT</option>
            <option value="CSE">CSE</option>
            <option value="CSM">CSM</option>
            <option value="ECE">ECE</option>
        </select> <br> <br>
        <button type="submit">Edit</button>
    </form>
</body>
<footer>
        <b>&copy; 2026 Student Management System. All rights reserved.</b>
    </footer>
</html>
