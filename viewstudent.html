<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View-Student</title>
    <link rel="stylesheet" href="./style.css">
    <nav>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./addstudent.html">Add-Students</a>
    <a href="./viewstudent.html">View-Students</a>
    <a href="./logout.html">LogOut</a>
    </nav>
    <script>
        function loadStudents() {   
            var students = JSON.parse(localStorage.getItem("students")) || [];
            var tbody = document.querySelector("table tbody");
            tbody.innerHTML = "";
            students.forEach(function(student) {
                var row = document.createElement("tr");
                row.innerHTML = "<td>" + student.name + "</td><td>" + student.id + "</td><td>" + student.branch + "</td><td><a href='./editstudent.html?id=" + encodeURIComponent(student.id) + "'>Edit</a> | <button onclick='deleteStudent(\"" + student.id + "\")'>Delete</button></td>";
                tbody.appendChild(row);
            });
        }
        window.onload = loadStudents;

        function deleteStudent(id) {
            var students = JSON.parse(localStorage.getItem("students")) || [];
            for(var i=0; i<students.length; i++){
               if(id === students[i].id){
                students.splice(i, 1);
                localStorage.setItem("students", JSON.stringify(students));
                alert('Student deleted successfully!');
                loadStudents();
                return ;
               }
            }
            alert('Student not found. Please try again.');
        }
    </script>
</head>
<body>
    <br>
    <b><h1>Students List</h1></b>
    <br><br>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Id</th>
                <th>Branch</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</body>

    </footer>
</html>
